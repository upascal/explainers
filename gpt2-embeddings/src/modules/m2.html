<div class="module" id="m2">
  <h4 class="m3title">Build a vocabulary from the corpus, one merge at a time</h4>
  <div class="m2flow" id="m2-flow" aria-hidden="true"></div>
  <div class="row">
    <span id="m2-bar"></span>
    <span class="note" id="m2-stats"></span>
  </div>
  <div class="cols2 m2grid">
    <div><h4>The corpus, in its current tokens</h4><div class="corpus m2corpus" id="m2-corpus"></div></div>
    <div><h4>Most common neighbouring pairs</h4><div class="vocabwrap" id="m2-pairs"></div>
      <h4 style="margin-top:14px">Merges so far</h4><div class="m2merges" id="m2-merges"></div></div>
  </div>
  <p class="note" id="m2-note" style="margin:10px 0 0"></p>
</div>
