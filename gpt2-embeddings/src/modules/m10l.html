<div class="module" id="m10l">
  <h4 class="m3title">Train the toy model on the corpus</h4>
  <div class="row">
    <label class="ctl">seed <input type="number" id="m10-seed" min="1" max="9999" step="1" value="1" class="m8num"></label>
    <button id="m10-seedrand">Random</button>
    <button class="primary" id="m10-train">Train</button>
    <label class="ctl">learning rate <span class="seg" id="m10-lr"><button data-v="0.01">0.01</button><button data-v="0.02">0.02</button><button data-v="0.05" class="on">0.05 (default)</button></span></label>
  </div>
  <div class="row"><span id="m10-bar"></span></div>
  <div class="cols2">
    <div><h4>Loss per token</h4><div id="m10-loss"></div></div>
    <div><h4>Learning rate <span style="text-transform:none">α</span></h4><div id="m10-alpha"></div></div>
  </div>
  <p class="note" id="m10-ghost" style="margin:6px 0 0"></p>
</div>
