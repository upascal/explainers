<div class="module" id="m5">
  <h4 class="m3title">Each position predicts the next token</h4>
  <p class="note" style="margin:0 0 14px">Pick a sentence, then drag the context along it or click a token. The model may look at the tokens inside the box, never ahead.</p>
  <div class="row"><label class="m3pick"><span class="lab">sentence</span><select id="m5-sent"></select></label></div>
  <div class="m3scroll"><div class="m3track m5track" id="m5-track"></div></div>
  <h4>Every prediction in this sentence</h4>
  <div class="m5preds" id="m5-preds"></div>
  <p class="note" style="margin:8px 0 0">Click a prediction to select it: sections 6 to 8 work through it.</p>
</div>
