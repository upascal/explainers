<div class="module" id="m1">
  <h4 class="m3title">Type anything and see GPT-2’s tokens</h4>
  <div class="row"><span class="presets" id="m1-ex"></span></div>
  <textarea id="m1-text" rows="3" spellcheck="false" aria-label="text to tokenize"></textarea>
  <p class="note" id="m1-stats" style="margin:8px 0 10px"></p>
  <div class="m1toks" id="m1-toks"></div>
  <p class="note" id="m1-detail" style="margin:10px 0 0">Click a token to see its ID and bytes. A dot · marks a space.</p>
</div>
