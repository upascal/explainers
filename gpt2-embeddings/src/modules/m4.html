<div class="module" id="m4">
  <h4 class="m3title">Add the position</h4>
  <div class="row">
    <label class="m3pick"><span class="lab">sentence</span><select id="m4-sent"></select></label>
    <span class="stepctl"><span class="lab">training step</span><input type="range" min="0" max="1" step="1" aria-label="training step"><span class="note sv"></span></span>
  </div>
  <div class="m4track" id="m4-track"></div>
  <div id="m4-eq"></div>
  <p class="note" style="margin:8px 0 0">Click a token to see its input vector. The same token at another position gets a different input vector.</p>
</div>
