<div class="module" id="m8a">
  <h4 class="m3title">Compare two words’ input vectors</h4>
  <div class="row">
    <label class="ctl">word <select id="m8a-center"></select></label>
    <label class="ctl">compared with <select id="m8a-other"></select></label>
    <label class="ctl">training <span class="seg" id="m8a-stage"><button data-v="start" class="on">start</button><button data-v="middle">middle</button><button data-v="trained">end</button></span></label>
  </div>
  <div class="cols2 m8agrid">
    <div><h4>The two input vectors, at their true angle</h4><div id="m8a-plane"></div></div>
    <div><h4>The angle between them over training</h4><div id="m8a-chart"></div></div>
  </div>
</div>
