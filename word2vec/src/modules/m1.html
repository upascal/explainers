<div class="module" id="m1">
  <h4 class="m3title">Can you guess a word by the company it keeps?</h4>
  <div class="row m1top">
    <div class="m1bank" id="m1-bank" role="group" aria-label="Words to place"></div>
    <button id="m1-reset">Start over</button>
  </div>
  <p class="note" style="margin:0 0 12px">Drag each word to the sentence it fits best, or tap a word and then a blank. Tap a filled blank to empty it.</p>
  <div class="m1sents" id="m1-sents"></div>
  <p class="note m1fb" id="m1-fb" aria-live="polite"></p>
</div>
