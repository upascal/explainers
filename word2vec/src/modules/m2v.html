<div class="module" id="m2v">
  <div class="row">
    <label class="ctl">word <span class="seg" id="m2v-word"><button data-v="coffee" class="on">coffee</button><button data-v="tea">tea</button><button data-v="dog">dog</button><button data-v="cat">cat</button></span></label>
    <span class="seg" id="m2v-state"><button data-v="untrained" class="on">untrained</button><button data-v="trained">trained</button></span>
  </div>
  <div id="m2v-vec"></div>
  <p class="note" id="m2v-note" style="margin:10px 0 0"></p>
  <div class="row" style="margin:14px 0 0">
    <button id="reroll">Re-roll initialization</button>
    <span class="note" id="m2-seed"></span>
  </div>
  <p class="note" style="margin:6px 0 0">Re-rolling draws new random input vectors and restarts training for the rest of the page.</p>
</div>
