<div class="module" id="m8">
  <h4 class="m3title">Watch the words arrange themselves</h4>
  <div class="row"><label class="ctl"><input type="checkbox" id="m8-out"> show output vectors v′</label></div>
  <div class="split8">
    <div>
      <h4>Input vectors, projected to 2D (PCA, approximate)</h4>
      <div class="m8map"><div id="m8-scatter"></div>
        <span class="m8zoom" role="group" aria-label="zoom the map"><button data-z="in" title="zoom in">+</button><button data-z="out" title="zoom out">−</button><button data-z="fit" title="fit the whole map">Fit</button></span></div>
      <div class="m8scrub" style="margin:12px 0 0">
        <input type="range" id="m8-scrub" min="0" max="1" step="1" value="0" aria-label="training progress">
        <span class="note" id="m8-pos"></span>
      </div>
    </div>
    <div>
      <h4>Nearest neighbours</h4>
      <label class="ctl" style="margin-bottom:8px">of <select id="m8-word"></select></label>
      <div id="m8-nn"></div>
      <p class="note">by cosine similarity, in all 5 dimensions</p>
    </div>
  </div>
</div>
