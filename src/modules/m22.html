<div class="module" id="m22">
  <div class="row">
    <label class="ctl">Temperature <input type="range" id="temp" min="0.3" max="2" step="0.05" value="1"> <b id="temp-v">1.00</b></label>
    <span class="seg transport">
      <button id="seq-reset" title="back to the prompt"></button>
      <button id="seq-prev" title="previous position"></button>
      <button id="seq-fwd" title="generate the next token"></button>
      <button id="seq-end" title="generate every remaining token"></button>
    </span>
    <span class="note" id="depth-note"></span>
  </div>
  <div id="dist-chart"></div>
  <div class="legend" id="dist-legend"></div>
  <p class="note" style="margin:10px 0 0" id="pmass-note"></p>
</div>
